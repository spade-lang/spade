[workspace]

members = [
    "spade-*",
    "vcd-translate",
    "tools/spadedoc"
]

resolver = "2"

# Shared between internal crates. Can be overridden per-crate if needed.

[workspace.package]
version = "0.20.0"
license = "EUPL-1.2"
edition = "2024"
rust-version = "1.89"
readme = "README.md"
homepage = "https://spade-lang.org"
repository = "https://codeberg.org/spade-lang/spade"

[workspace.dependencies]
spade-lang = {path = "spade-compiler", version = "0.20.0"}
spade-ast = {path = "spade-ast", version = "0.20.0"}
spade-ast-lowering = {path = "spade-ast-lowering", version = "0.20.0"}
spade-common = {path = "spade-common", version = "0.20.0"}
spade-diagnostics = { path = "spade-diagnostics" , version = "0.20.0"}
spade-hir = {path = "spade-hir", version = "0.20.0"}
spade-hir-lowering = {path = "spade-hir-lowering", version = "0.20.0"}
spade-macros = {path = "spade-macros", version = "0.20.0"}
spade-mir = {path = "spade-mir", version = "0.20.0"}
spade-parser = {path = "spade-parser", version = "0.20.0"}
spade-typeinference = {path = "spade-typeinference", version = "0.20.0"}
spade-types = {path = "spade-types", version = "0.20.0"}
spade-query = {path = "spade-query", version = "0.20.0"}

bumpalo = { version = "3.14.0" }
clap = { version = "4.6", features = ["derive"] }
color-eyre = "0.6.1"
derive-where = "1.2.7"
spade-codespan = {version = "0.12.0", features = ["serde"]}
spade-codespan-reporting = {version = "0.12.0", features = ["serde"]}
colored = "3.0"
imbl = {version = "6.1.0", features = ["serde"]}
indoc = "2.0"
insta = "1.14.0"
itertools = "0.14"
local-impl = "0.1.2"
logos = "0.16.0"
num = {version = "0.4.0", features = ["serde"]}
pretty_assertions = "1.4.1"
prettydiff = { version = "0.9", default-features = false }
pyo3 = { version = "0.28", features = ["extension-module", "eyre", "abi3-py38"] }
rayon = { version = "1.11.0" }
recursive = {version = "0.1.1"}
ron = {version = "0.12.0", features=["integer128"]}
fastrand = {version = "2.3.0"}
postcard = {version = "1.1.3", features=["use-std"]}
serde = { version = "1.0.136", features = ["derive"] }
serde_json = "1.0.117"
tap = "1.0.1"
thiserror = "2.0.11"
tracing = "0.1.34"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tracing-tree = "0.4"
rustc-hash = "2.1"
tikv-jemallocator = "0.6.1"



[profile.release]
codegen-units=1
# lto="fat"

[workspace.lints]
# allow unkown lints to enable linting and configuring lints from newer rust versions compared to the CI version
rust.unknown_lints = "allow"

[workspace.lints.clippy]

bind_instead_of_map="warn"
clone_on_copy="warn"
collapsible_else_if="warn"
collapsible_if="warn"
filter_map_identity="warn"
for_kv_map="warn"
iter_kv_map="warn"
iter_over_hash_type="warn"
iter_skip_next="warn"
manual_map="warn"
map_clone="warn"
map_flatten="warn"
map_identity="warn"
needless_bool="warn"
needless_borrow="warn"
needless_borrows_for_generic_args="warn"
needless_lifetimes="warn"
needless_maybe_sized="warn"
needless_return="warn"
needless_return_with_question_mark="warn"
redundant_closure="warn"
redundant_field_names="warn"
redundant_iter_cloned="warn"
redundant_pattern_matching="warn"
unnecessary_filter_map="warn"
unnecessary_find_map="warn"
unnecessary_map_or="warn"
unnecessary_mut_passed="warn"
unnecessary_unwrap="warn"
unneeded_struct_pattern="warn"
unusual_byte_groupings="warn"
useless_borrows_in_formatting="warn"
useless_conversion="warn"
useless_format="warn"
useless_vec="warn"

# Allow all lints that were hit at the start of the clippy linting initiative, to be gradually corrected
bool_comparison="allow"
borrow_deref_ref="allow"
borrowed_box="allow"
box_default="allow"
comparison_to_empty="allow"
crate_in_macro_def="allow"
default_constructed_unit_structs="allow"
empty_line_after_doc_comments="allow"
explicit_auto_deref="allow"
extra_unused_lifetimes="allow"
get_first="allow"
into_iter_on_ref="allow"
large_enum_variant="allow"
len_zero="allow"
let_and_return="allow"
manual_is_multiple_of="allow"
manual_repeat_n="allow"
manual_strip="allow"
match_like_matches_macro="allow"
match_single_binding="allow"
new_without_default="allow"
non_canonical_partial_ord_impl="allow"
non_minimal_cfg="allow"
nonminimal_bool="allow"
only_used_in_recursion="allow"
option_map_unit_fn="allow"
ptr_arg="allow"
question_mark="allow"
result_large_err="allow"
result_unit_err="allow"
search_is_some="allow"
single_match="allow"
single_range_in_vec_init="allow"
too_many_arguments="allow"
type_complexity="allow"
unwrap_or_default="allow"
while_let_on_iterator="allow"
wrong_self_convention="allow"
# end of the mass allow
